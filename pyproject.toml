[project]
name = "smart-client"
version = "0.3.0"
description = "Commandline klient til Smartarkivering.dk-afleveringer"
authors = [
    {name="Claus Juhl Knudsen", email="cjk@aarhus.dk"}
]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "dicttoxml>=1.7.16",
    "httpx>=0.28.1",
    "pyinstaller>=6.16.0",
    "six>=1.17.0",
]

[project.scripts]
aflevering = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
